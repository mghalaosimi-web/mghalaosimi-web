<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172B4D">
  <meta name="description" content="The requested page could not be found. Return to the official M.GH.AL website.">
  <meta name="robots" content="noindex, follow">
  <link rel="stylesheet" href="/assets/theme.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>404 — Page not found | M.GH.AL</title>
  <meta property="og:title" content="Page not found | M.GH.AL">
  <meta property="og:description" content="The requested page could not be found.">
  <meta property="og:image" content="https://mghal.vercel.app/assets/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://mghal.vercel.app/assets/og-image.svg">
  <style>
    .error-page{min-height:100svh;display:grid;place-items:center;padding:32px 18px}
    .error-card{width:min(680px,100%);padding:clamp(28px,6vw,56px);text-align:center;background:var(--mghal-white,#fff);border:1px solid var(--mghal-border,#DCE2E8);border-radius:24px;box-shadow:0 18px 55px rgba(23,43,77,.09)}
    .error-code{margin:0;color:var(--mghal-navy,#172B4D);font-size:clamp(84px,20vw,150px);line-height:1;font-weight:800;letter-spacing:-.07em}
    .error-title{margin:18px 0 10px;color:var(--mghal-navy,#172B4D)}
    .error-copy{max-width:44ch;margin:0 auto 26px;color:var(--mghal-muted,#64748B);line-height:1.8}
    .error-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
    .error-actions a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:11px 20px;border:1px solid var(--mghal-border,#DCE2E8);border-radius:12px;text-decoration:none;font-weight:700}
    .error-actions a:first-child{background:var(--mghal-navy,#172B4D);border-color:var(--mghal-navy,#172B4D);color:#fff}
    @media(prefers-reduced-motion:no-preference){.error-card{animation:rise-in .45s ease-out both}@keyframes rise-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}}
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content" class="error-page">
    <section class="error-card" aria-labelledby="error-title">
      <a href="/" aria-label="M.GH.AL homepage" style="display:inline-block;margin-bottom:28px;color:var(--mghal-navy,#172B4D);font-weight:800;font-size:1.2rem;text-decoration:none">M.GH.AL</a>
      <p class="error-code" aria-hidden="true">404</p>
      <h1 class="error-title" id="error-title">Page not found</h1>
      <p class="error-copy">The page may have moved, the address may be incorrect, or the content is no longer available.</p>
      <div class="error-actions">
        <a href="/">Return to homepage</a>
        <a href="/contact.html">Contact</a>
      </div>
    </section>
  </main>
  <script src="/assets/site.js" defer></script>
</body>
</html>
