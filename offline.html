<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07110f">
  <meta name="robots" content="noindex, nofollow">
  <title>أنت غير متصل — M.GH.AL</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#07110f;color:#edf4ef}
    *{box-sizing:border-box}body{min-height:100svh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0,#12372d,transparent 65%),#07110f}
    main{width:min(100%,560px);padding:clamp(26px,6vw,48px);border:1px solid #285247;border-radius:24px;background:#0e1d19;text-align:center;box-shadow:0 24px 80px #0006}
    .brand{font:800 28px Arial,sans-serif;letter-spacing:2px;color:#8dd9c9}h1{font-size:clamp(24px,5vw,34px);margin:24px 0 12px}p{color:#a6b8ae;line-height:1.9}
    a,button{display:inline-block;margin:8px 4px;padding:11px 18px;border:1px solid #32675a;border-radius:10px;background:#147a68;color:#fff;font:inherit;text-decoration:none;cursor:pointer}
    button{background:transparent}
  </style>
</head>
<body>
  <main>
    <div class="brand">M.GH.AL</div>
    <h1>أنت غير متصل بالإنترنت</h1>
    <p>تعذر الوصول إلى الصفحة المطلوبة حالياً. يمكنك العودة إلى الصفحة الرئيسية أو إعادة المحاولة عندما يتوفر الاتصال.</p>
    <a href="/">العودة إلى الصفحة الرئيسية</a>
    <button type="button" onclick="location.reload()">إعادة المحاولة</button>
  </main>
</body>
</html>
