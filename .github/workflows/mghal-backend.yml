name: M.GH.AL Backend CI
on:
  push:
    branches: [fix/site-quality-audit-2026-10-31, feature/mghal-arfat-full-integration, fix/social-admin-mobile-ux-2026-11-07, feat/node-postgres-backend-2026-11-08]
    paths: ["mghal-backend/**", ".github/workflows/mghal-backend.yml"]
  pull_request:
    paths: ["mghal-backend/**"]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mghal-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run check
