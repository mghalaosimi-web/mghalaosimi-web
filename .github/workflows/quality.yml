name: Website Quality

on:
  push:
    branches:
      - fix/site-quality-audit-2026-10-31
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned development dependencies
        run: npm install --ignore-scripts --no-package-lock

      - name: Run type checks and compile browser scripts
        run: npm run quality

      - name: Upload compiled browser scripts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-browser-scripts
          path: dist/scripts/
          if-no-files-found: error
          retention-days: 7
