name: M.GH.AL Next.js quality checks
on:
  pull_request:
    branches: [main, feature/mghal-arfat-full-integration, fix/social-admin-mobile-ux-2026-11-07, feat/node-postgres-backend-2026-11-08]
  push:
    branches: [feature/mghal-arfat-full-integration, fix/social-admin-mobile-ux-2026-11-07, feat/node-postgres-backend-2026-11-08]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify workspace lockfiles
        run: |
          pwd
          git ls-files package-lock.json
          ls -l package-lock.json
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package-lock.json','utf8'));console.log('lockfileVersion='+p.lockfileVersion)"
          npm config get package-lock
        working-directory: ${{ github.workspace }}
      - run: npm ci --no-audit --no-fund
        working-directory: ${{ github.workspace }}
      - name: Patch Next.js security advisories on Phase 1 PR #52
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 52
        run: npm install --save-exact next@15.5.29
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run audit:credentials
      - run: npm run test:certificates
      - run: npm run audit:profile
      - run: npm run audit:design
      - run: npm run audit:pwa
      - run: npm run test:api-runtime
      - run: npm run test:security-headers
      - run: npm run test:structured-data
      - run: npm run test:seo
      - run: npm run test:sitemap
      - name: Normalize clean URLs before project-page checks
        run: node scripts/normalize-legacy-html-links.mjs
      - run: npm run test:project-pages
      - run: npm run test:navigation
      - run: npm run test:search
      - run: npm --prefix mghal-backend ci --no-audit --no-fund
      - run: npm --prefix mghal-backend audit --omit=dev --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Commit verified Next.js security patch to PR #52
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 52
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Next.js dependency files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(deps): patch Next.js security advisories"
          git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push origin "HEAD:$TARGET_BRANCH"
