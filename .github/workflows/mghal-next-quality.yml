name: M.GH.AL Next.js quality checks
on:
  pull_request:
    branches: [main, feature/mghal-arfat-full-integration, fix/social-admin-mobile-ux-2026-11-07, feat/node-postgres-backend-2026-11-08]
  push:
    branches: [feature/mghal-arfat-full-integration, fix/social-admin-mobile-ux-2026-11-07, feat/node-postgres-backend-2026-11-08, feat/mghal-phase2-experience-2026-11-08]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run audit:credentials
      - run: npm run test:certificates
      - run: npm run audit:profile
      - run: npm run audit:design
      - run: npm run audit:pwa
      - run: npm run test:api-proxy
      - run: npm run test:seo
      - run: npm run test:sitemap
      - run: npm run test:navigation
      - run: npm run test:search
      - run: npm run test:project-case-studies
      - run: npm --prefix mghal-backend ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build


