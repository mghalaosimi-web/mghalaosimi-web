name: M.GH.AL Next.js quality checks
on:
  pull_request:
    branches: [main, feature/mghal-arfat-full-integration]
  push:
    branches: [feature/mghal-arfat-full-integration, fix/social-admin-mobile-ux-2026-11-07]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Capture root npm lockfile for deterministic Vercel installs
        uses: actions/upload-artifact@v4
        with:
          name: mghal-root-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - run: npm run audit:credentials
      - run: npm run test:certificates
      - run: npm run audit:profile
      - run: npm run test:api-proxy
      - run: npm run test:seo
      - run: npm --prefix mghal-backend install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
